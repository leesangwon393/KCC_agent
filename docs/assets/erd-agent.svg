<svg xmlns="http://www.w3.org/2000/svg" width="1408" height="570" viewBox="0 0 1408 570" role="img" aria-labelledby="title desc"><title id="title">모아 ERD · Mac 연결과 명령</title><desc id="desc">User는 여러 AgentLink, AgentCommand, MacPairing을 소유한다. AgentLink 하나에 여러 AgentCommand가 연결된다. OnboardingProgress와 AppleIdentity는 User당 최대 하나다.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#3B3F4A}.name{font-size:23px;font-weight:750}.field{font-size:18px}.key{font-size:14px;font-weight:700;fill:#647DA3}.rel{font-size:16px;font-weight:650;fill:#626975}</style><path d="M280 80H380" fill="none" stroke="#9BA6B5" stroke-width="2"/><rect x="280" y="42" width="84" height="25" rx="6" fill="#FAF8F5"/><text class="rel" x="285" y="60">1 : 0..N</text><path d="M750 130H900" fill="none" stroke="#9BA6B5" stroke-width="2"/><rect x="778" y="90" width="84" height="25" rx="6" fill="#FAF8F5"/><text class="rel" x="783" y="108">1 : 0..N</text><path d="M140 190V360" fill="none" stroke="#9BA6B5" stroke-width="2"/><rect x="150" y="262" width="84" height="25" rx="6" fill="#FAF8F5"/><text class="rel" x="155" y="280">1 : 0..N</text><path d="M140 315H655V360" fill="none" stroke="#9BA6B5" stroke-width="2"/><rect x="521" y="289" width="84" height="25" rx="6" fill="#FAF8F5"/><text class="rel" x="526" y="307">1 : 0..1</text><path d="M655 315H1170V360" fill="none" stroke="#9BA6B5" stroke-width="2"/><rect x="1035" y="289" width="84" height="25" rx="6" fill="#FAF8F5"/><text class="rel" x="1040" y="307">1 : 0..1</text><g transform="translate(0 0)"><rect width="280" height="190" rx="18" fill="#FFFDFA" stroke="#DEDAD4"/><path d="M18 0H262Q280 0 280 18V56H0V18Q0 0 18 0Z" fill="#A9C9F5"/><text class="name" x="20" y="36">User · auth_user</text><text class="key" x="18" y="85">PK</text><text class="field" x="64" y="85">id · integer</text><text class="key" x="18" y="115">UK</text><text class="field" x="64" y="115">username</text><text class="key" x="18" y="145"></text><text class="field" x="20" y="145">password · hash</text><text class="key" x="18" y="175"></text><text class="field" x="20" y="175">first_name</text></g><g transform="translate(380 0)"><rect width="370" height="220" rx="18" fill="#FFFDFA" stroke="#DEDAD4"/><path d="M18 0H352Q370 0 370 18V56H0V18Q0 0 18 0Z" fill="#B6E5CF"/><text class="name" x="20" y="36">AgentLink</text><text class="key" x="18" y="85">PK</text><text class="field" x="64" y="85">id · uuid</text><text class="key" x="18" y="115">FK</text><text class="field" x="64" y="115">owner_id</text><text class="key" x="18" y="145">UK</text><text class="field" x="64" y="145">token_hash · sha256</text><text class="key" x="18" y="175"></text><text class="field" x="20" y="175">label / last_seen_at</text><text class="key" x="18" y="205"></text><text class="field" x="20" y="205">snapshot · JSON</text></g><g transform="translate(900 0)"><rect width="400" height="220" rx="18" fill="#FFFDFA" stroke="#DEDAD4"/><path d="M18 0H382Q400 0 400 18V56H0V18Q0 0 18 0Z" fill="#F8C4A4"/><text class="name" x="20" y="36">AgentCommand</text><text class="key" x="18" y="85">PK</text><text class="field" x="64" y="85">id · uuid</text><text class="key" x="18" y="115">FK</text><text class="field" x="64" y="115">owner_id / link_id</text><text class="key" x="18" y="145"></text><text class="field" x="20" y="145">action / status</text><text class="key" x="18" y="175"></text><text class="field" x="20" y="175">payload / result · JSON</text><text class="key" x="18" y="205"></text><text class="field" x="20" y="205">finished_at</text></g><g transform="translate(0 360)"><rect width="330" height="190" rx="18" fill="#FFFDFA" stroke="#DEDAD4"/><path d="M18 0H312Q330 0 330 18V56H0V18Q0 0 18 0Z" fill="#D4C8F0"/><text class="name" x="20" y="36">MacPairing</text><text class="key" x="18" y="85">PK</text><text class="field" x="64" y="85">id · uuid</text><text class="key" x="18" y="115">FK</text><text class="field" x="64" y="115">owner_id</text><text class="key" x="18" y="145">UK</text><text class="field" x="64" y="145">secret_hash</text><text class="key" x="18" y="175"></text><text class="field" x="20" y="175">expires_at / consumed_at</text></g><g transform="translate(440 360)"><rect width="430" height="190" rx="18" fill="#FFFDFA" stroke="#DEDAD4"/><path d="M18 0H412Q430 0 430 18V56H0V18Q0 0 18 0Z" fill="#F7E3A3"/><text class="name" x="20" y="36">OnboardingProgress</text><text class="key" x="18" y="85">PK</text><text class="field" x="64" y="85">id · bigint</text><text class="key" x="18" y="115">1:1</text><text class="field" x="64" y="115">owner_id · unique</text><text class="key" x="18" y="145"></text><text class="field" x="20" y="145">iphone_icloud_confirmed</text><text class="key" x="18" y="175"></text><text class="field" x="20" y="175">test_started_at / completed_at</text></g><g transform="translate(980 360)"><rect width="428" height="160" rx="18" fill="#FFFDFA" stroke="#DEDAD4"/><path d="M18 0H410Q428 0 428 18V56H0V18Q0 0 18 0Z" fill="#A9C9F5"/><text class="name" x="20" y="36">AppleIdentity · 선택 기능</text><text class="key" x="18" y="85">PK</text><text class="field" x="64" y="85">id · bigint</text><text class="key" x="18" y="115">1:1</text><text class="field" x="64" y="115">owner_id · unique</text><text class="key" x="18" y="145">UK</text><text class="field" x="64" y="145">subject</text></g></svg>