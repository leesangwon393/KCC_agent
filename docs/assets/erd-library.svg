<svg xmlns="http://www.w3.org/2000/svg" width="1408" height="540" viewBox="0 0 1408 540" role="img" aria-labelledby="title desc"><title id="title">모아 ERD · 파일 메타데이터</title><desc id="desc">User가 Device, Folder, FileRecord, ReviewRequest를 소유한다. FileRecord는 선택적으로 Device와 Folder를 참조하며 ReviewRequest는 파일당 최대 하나다.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#3B3F4A}.name{font-size:23px;font-weight:750}.field{font-size:18px}.key{font-size:14px;font-weight:700;fill:#647DA3}.rel{font-size:16px;font-weight:650;fill:#626975}</style><path d="M245 230H282V110H330" fill="none" stroke="#9BA6B5" stroke-width="2"/><rect x="250" y="121" width="84" height="25" rx="6" fill="#FAF8F5"/><text class="rel" x="255" y="139">1 : 0..N</text><path d="M245 260H282V380H330" fill="none" stroke="#9BA6B5" stroke-width="2"/><rect x="250" y="333" width="84" height="25" rx="6" fill="#FAF8F5"/><text class="rel" x="255" y="351">1 : 0..N</text><path d="M610 110H660V165H710" fill="none" stroke="#9BA6B5" stroke-width="2"/><rect x="613" y="70" width="111" height="25" rx="6" fill="#FAF8F5"/><text class="rel" x="618" y="88">0..1 : 0..N</text><path d="M610 380H660V325H710" fill="none" stroke="#9BA6B5" stroke-width="2"/><rect x="611" y="393" width="111" height="25" rx="6" fill="#FAF8F5"/><text class="rel" x="616" y="411">0..1 : 0..N</text><path d="M1040 235H1120" fill="none" stroke="#9BA6B5" stroke-width="2"/><rect x="1042" y="197" width="84" height="25" rx="6" fill="#FAF8F5"/><text class="rel" x="1047" y="215">1 : 0..1</text><g transform="translate(0 150)"><rect width="245" height="190" rx="18" fill="#FFFDFA" stroke="#DEDAD4"/><path d="M18 0H227Q245 0 245 18V56H0V18Q0 0 18 0Z" fill="#A9C9F5"/><text class="name" x="20" y="36">User · auth_user</text><text class="key" x="18" y="85">PK</text><text class="field" x="64" y="85">id · integer</text><text class="key" x="18" y="115">UK</text><text class="field" x="64" y="115">username</text><text class="key" x="18" y="145"></text><text class="field" x="20" y="145">password · hash</text><text class="key" x="18" y="175"></text><text class="field" x="20" y="175">first_name</text></g><g transform="translate(330 0)"><rect width="280" height="190" rx="18" fill="#FFFDFA" stroke="#DEDAD4"/><path d="M18 0H262Q280 0 280 18V56H0V18Q0 0 18 0Z" fill="#D4C8F0"/><text class="name" x="20" y="36">Device</text><text class="key" x="18" y="85">PK</text><text class="field" x="64" y="85">id · uuid</text><text class="key" x="18" y="115">FK</text><text class="field" x="64" y="115">owner_id</text><text class="key" x="18" y="145"></text><text class="field" x="20" y="145">name / platform</text><text class="key" x="18" y="175"></text><text class="field" x="20" y="175">last_seen_at</text></g><g transform="translate(330 285)"><rect width="280" height="190" rx="18" fill="#FFFDFA" stroke="#DEDAD4"/><path d="M18 0H262Q280 0 280 18V56H0V18Q0 0 18 0Z" fill="#B6E5CF"/><text class="name" x="20" y="36">Folder</text><text class="key" x="18" y="85">PK</text><text class="field" x="64" y="85">id · uuid</text><text class="key" x="18" y="115">FK</text><text class="field" x="64" y="115">owner_id</text><text class="key" x="18" y="145"></text><text class="field" x="20" y="145">name</text><text class="key" x="18" y="175"></text><text class="field" x="20" y="175">instructions_md</text></g><g transform="translate(710 65)"><rect width="330" height="310" rx="18" fill="#FFFDFA" stroke="#DEDAD4"/><path d="M18 0H312Q330 0 330 18V56H0V18Q0 0 18 0Z" fill="#F8C4A4"/><text class="name" x="20" y="36">FileRecord</text><text class="key" x="18" y="85">PK</text><text class="field" x="64" y="85">id · uuid</text><text class="key" x="18" y="115">FK</text><text class="field" x="64" y="115">owner_id</text><text class="key" x="18" y="145">FK</text><text class="field" x="64" y="145">source_device_id · nullable</text><text class="key" x="18" y="175">FK</text><text class="field" x="64" y="175">folder_id · nullable</text><text class="key" x="18" y="205"></text><text class="field" x="20" y="205">name / mime_type</text><text class="key" x="18" y="235"></text><text class="field" x="20" y="235">size_bytes / sha256</text><text class="key" x="18" y="265"></text><text class="field" x="20" y="265">status / source_kind</text><text class="key" x="18" y="295"></text><text class="field" x="20" y="295">classification_reason</text></g><g transform="translate(1120 110)"><rect width="288" height="220" rx="18" fill="#FFFDFA" stroke="#DEDAD4"/><path d="M18 0H270Q288 0 288 18V56H0V18Q0 0 18 0Z" fill="#F7E3A3"/><text class="name" x="20" y="36">ReviewRequest</text><text class="key" x="18" y="85">PK</text><text class="field" x="64" y="85">id · uuid</text><text class="key" x="18" y="115">FK</text><text class="field" x="64" y="115">owner_id</text><text class="key" x="18" y="145">1:1</text><text class="field" x="64" y="145">file_id · unique</text><text class="key" x="18" y="175"></text><text class="field" x="20" y="175">question / answer</text><text class="key" x="18" y="205"></text><text class="field" x="20" y="205">status / answered_at</text></g><text class="rel" x="0" y="510">공통: 모든 업무 엔티티는 owner_id → User, created_at 보유 · Folder는 (owner_id, name) 고유 · 관계는 왼쪽 : 오른쪽</text></svg>